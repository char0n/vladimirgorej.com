<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" font-family="Liberation Sans, Arial, Helvetica, sans-serif">
  <defs>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.6" fill="#ffffff" opacity="0.06"/>
    </pattern>
  </defs>

  <rect width="1280" height="520" fill="#1b2026"/>
  <rect width="1280" height="520" fill="url(#dots)"/>

  <!-- corner framing -->
  <text x="80" y="84" font-size="13" letter-spacing="4" fill="#ffffff" opacity="0.4">PACKETS</text>
  <text x="1200" y="84" font-size="13" letter-spacing="4" fill="#ffffff" opacity="0.4" text-anchor="end">PIXELS</text>

  <!-- title block -->
  <text x="80" y="196" font-size="14" font-weight="700" letter-spacing="3" fill="#fd7e14">A HANDS-ON SERIES IN FOUR PARTS</text>
  <text x="78" y="258" font-size="56" font-weight="700" fill="#ffffff">From packets</text>
  <text x="78" y="320" font-size="56" font-weight="700" fill="#ffffff">to pixels</text>
  <rect x="316" y="304" width="14" height="14" rx="3" fill="#fd7e14"/>
  <text x="80" y="362" font-size="17" fill="#98a2ad">How the web actually works: the network, HTML, CSS, and JavaScript.</text>

  <!-- assembling page -->
  <rect x="860" y="110" width="340" height="270" rx="14" fill="#ffffff" fill-opacity="0.04" stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5"/>
  <circle cx="886" cy="138" r="4.5" fill="#ffffff" opacity="0.25"/>
  <circle cx="902" cy="138" r="4.5" fill="#ffffff" opacity="0.25"/>
  <circle cx="918" cy="138" r="4.5" fill="#ffffff" opacity="0.25"/>
  <line x1="860" y1="156" x2="1200" y2="156" stroke="#ffffff" stroke-opacity="0.14" stroke-width="1.5"/>

  <!-- hero bar: orange pixels, two still missing -->
  <rect x="884" y="176" width="18" height="18" rx="4" fill="#fd7e14"/>
  <rect x="906" y="176" width="18" height="18" rx="4" fill="#fd7e14"/>
