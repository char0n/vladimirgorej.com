    <tspan font-weight="700" fill="#fd7e14" dx="48">03</tspan><tspan fill="#98a2ad" dx="8">CSS</tspan>
    <tspan font-weight="700" fill="#fd7e14" dx="48">04</tspan><tspan fill="#98a2ad" dx="8">JAVASCRIPT</tspan>
  </text>
  <text x="1200" y="456" font-size="14" letter-spacing="2" fill="#98a2ad" text-anchor="end">VLADIMIRGOREJ.COM</text>
